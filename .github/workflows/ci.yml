name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1028:1025
          - 8028:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: laravel
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        working-directory: laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: laravel
        run: php artisan test --parallel --processes=4

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: dashboard
        run: pnpm typecheck

      - name: Unit tests
        working-directory: dashboard
        run: pnpm test:unit

      - name: Build
        working-directory: dashboard
        run: pnpm build

      - name: Upload tracker.js
        uses: actions/upload-artifact@v4
        with:
          name: tracker
          path: dashboard/dist/tracker.js
          if-no-files-found: error

  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE=ghcr.io/reisi007/analytics/laravel
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:test" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }},${IMAGE}:test" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm build

      - name: Start E2E stack
        env:
          IMAGE_TAG: test
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for web to be ready
        run: curl --retry 30 --retry-delay 2 --retry-all-errors -sf http://localhost:8081/

      - name: Migrate and seed database
        env:
          ANALYTICS_ADMIN_EMAIL: admin@e2e.local
          ANALYTICS_ADMIN_PASSWORD: password
        run: |
          docker compose -f docker-compose.test.yml exec -T \
            -e ANALYTICS_ADMIN_EMAIL="$ANALYTICS_ADMIN_EMAIL" \
            -e ANALYTICS_ADMIN_PASSWORD="$ANALYTICS_ADMIN_PASSWORD" \
            php php artisan migrate --seed --force

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: e2e
        # TODO e2e: The Playwright test suite itself is implemented in the next step.
        run: npx playwright test

      - name: Teardown E2E stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [php-tests, frontend-tests, e2e-tests, build-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm build

      - name: Package dashboard release
        run: cd dashboard && zip -r ../dashboard-release.zip dist

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .git-cliff.toml
          args: --bump --unreleased --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.cliff.outputs.version }}"
          git push origin "v${{ steps.cliff.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cliff.outputs.version }}
          body_path: ${{ steps.cliff.outputs.changelog }}
          files: dashboard-release.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
