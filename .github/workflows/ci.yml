name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1028:1025
          - 8028:8025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: xdebug

      - name: Install dependencies
        working-directory: laravel
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        working-directory: laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: laravel
        run: php artisan test --parallel --processes=4 --coverage --coverage-text

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.10.0

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: dashboard
        run: pnpm typecheck

      - name: Unit tests
        working-directory: dashboard
        run: pnpm test:coverage

      - name: Build
        working-directory: dashboard
        run: pnpm build

      - name: Upload tracker.js
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tracker
          path: dashboard/dist/tracker.js
          if-no-files-found: error

  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tags.outputs.image-tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE=ghcr.io/reisi007/analytics
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:test" >> "$GITHUB_OUTPUT"
            echo "image-tag=test" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}-test" >> "$GITHUB_OUTPUT"
            echo "image-tag=pr-${{ github.event.pull_request.number }}-test" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ github.ref_name }},${IMAGE}:test" >> "$GITHUB_OUTPUT"
            echo "image-tag=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.10.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm build

      - name: Pull E2E image
        run: docker pull ghcr.io/reisi007/analytics:${{ needs.build-image.outputs.image-tag }}

      - name: Start E2E stack
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for web to be ready
        run: curl --retry 30 --retry-delay 2 --retry-all-errors -sf http://localhost:8081/

      - name: Migrate and seed database
        env:
          ANALYTICS_ADMIN_EMAIL: admin@e2e.local
          ANALYTICS_ADMIN_PASSWORD: password
        run: |
          docker compose -f docker-compose.test.yml exec -T \
            -e ANALYTICS_ADMIN_EMAIL="$ANALYTICS_ADMIN_EMAIL" \
            -e ANALYTICS_ADMIN_PASSWORD="$ANALYTICS_ADMIN_PASSWORD" \
            php php artisan migrate --seed --force

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Teardown E2E stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [php-tests, frontend-tests, e2e-tests, build-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.10.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm build

      - name: Package dashboard release
        run: cd dashboard && zip -r ../dashboard-release.zip dist

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: .git-cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.cliff.outputs.changelog }}
          files: dashboard-release.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
