services:
  analytics_db:
    image: postgres:18-alpine
    container_name: analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
    networks:
      - analytics_internal

  analytics_php:
    image: ghcr.io/reisi007/analytics:latest
    container_name: analytics_php
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      analytics_db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: pgsql
      DB_HOST: analytics_db
      DB_PORT: 5432
      DB_DATABASE: analytics
      DB_USERNAME: analytics
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      REPORT_EMAIL: ${REPORT_EMAIL}
      STREAM_POLL_SECONDS: ${STREAM_POLL_SECONDS:-2}
      STREAM_MAX_RUNTIME: ${STREAM_MAX_RUNTIME:-300}
      LOG_CHANNEL: stderr
      ANALYTICS_ADMIN_EMAIL: ${ANALYTICS_ADMIN_EMAIL}
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Europe/Berlin}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_REFRESH_TOKEN: ${OAUTH_REFRESH_TOKEN}
      MAKE_WEBHOOK_URL: ${MAKE_WEBHOOK_URL:-}
      MAKE_API_KEY: ${MAKE_API_KEY:-}
    command: >
      sh -c "if [ \"$$APP_ENV\" = \"production\" ]; then
      if [ -z \"$$APP_KEY\" ] || [ -z \"$$JWT_SECRET\" ] || [ -z \"$$ANALYTICS_ADMIN_EMAIL\" ] || [ -z \"$$ANALYTICS_ADMIN_PASSWORD\" ]; then
      echo 'FATAL: APP_KEY/JWT_SECRET/ANALYTICS_ADMIN_EMAIL/ANALYTICS_ADMIN_PASSWORD fehlt'; exit 1; fi; fi;
      php artisan migrate --force;
      php artisan seed:if-empty;
      php artisan config:cache;
      php artisan route:cache;
      php artisan optimize;
      (while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done) &
      exec php-fpm"
    healthcheck:
      test: ["CMD", "php", "-r", "$$e=0;$$s='';exit(@fsockopen('127.0.0.1',9000,$$e,$$s,2)?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
    networks:
      analytics_internal: {}
      webnet:
        ipv4_address: 172.18.0.40

volumes:
  pgdata:
  storage:

networks:
  analytics_internal:
  webnet:
    external: true
